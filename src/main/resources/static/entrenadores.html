<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entrenadores · FutbolManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        :root{--accent:#7c3aed;--accent2:#2563eb;--success:#059669;--border:rgba(255,255,255,0.08);--text-muted:rgba(255,255,255,0.4);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#060612;color:#fff;min-height:100vh;overflow-x:hidden;}
        #bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
        .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:rgba(10,8,30,0.9);backdrop-filter:blur(20px);border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;padding:1.5rem 0;}
        .sidebar-logo{padding:0 1.5rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem;}
        .logo-text{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#7c3aed,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .logo-sub{font-size:0.7rem;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;}
        .nav-section{padding:0 0.75rem;margin-bottom:0.5rem;}
        .nav-section-title{font-size:0.65rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;padding:0 0.75rem;margin-bottom:0.5rem;}
        .nav-item{display:flex;align-items:center;gap:0.75rem;padding:0.65rem 0.75rem;border-radius:10px;color:rgba(255,255,255,0.6);font-size:0.875rem;font-weight:500;text-decoration:none;transition:all 0.2s;margin-bottom:2px;}
        .nav-item:hover{background:rgba(255,255,255,0.04);color:#fff;}
        .nav-item.active{background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(37,99,235,0.3));color:#fff;border:1px solid rgba(124,58,237,0.3);}
        .nav-item i{font-size:1rem;width:20px;text-align:center;}
        .main{margin-left:240px;padding:2rem;position:relative;z-index:1;}
        .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
        .page-title{font-size:1.75rem;font-weight:800;}
        .page-title span{background:linear-gradient(135deg,#34d399,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .page-sub{color:var(--text-muted);font-size:0.85rem;margin-top:2px;}
        .btn-add{background:linear-gradient(135deg,#059669,#0ea5e9);border:none;border-radius:12px;padding:10px 22px;font-weight:600;font-size:0.875rem;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 0.3s;box-shadow:0 4px 20px rgba(5,150,105,0.4);}
        .btn-add:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(5,150,105,0.6);}
        .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem;}
        .coach-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:20px;padding:1.5rem;transition:all 0.35s cubic-bezier(0.175,0.885,0.32,1.275);position:relative;overflow:hidden;}
        .coach-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#7c3aed,#2563eb,#059669);transform:scaleX(0);transition:transform 0.3s;transform-origin:left;}
        .coach-card:hover{transform:translateY(-8px);border-color:rgba(124,58,237,0.4);box-shadow:0 20px 50px rgba(0,0,0,0.4);}
        .coach-card:hover::before{transform:scaleX(1);}
        .coach-avatar{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#7c3aed,#059669);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;color:#fff;margin-bottom:1rem;box-shadow:0 8px 20px rgba(124,58,237,0.3);}
        .coach-name{font-size:1.05rem;font-weight:700;margin-bottom:0.25rem;}
        .coach-meta{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;}
        .meta-tag{background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:8px;padding:3px 10px;font-size:0.75rem;color:rgba(255,255,255,0.7);display:flex;align-items:center;gap:5px;}
        .meta-tag.green{background:rgba(5,150,105,0.15);border-color:rgba(5,150,105,0.3);color:#34d399;}
        .coach-actions{display:flex;gap:0.5rem;}
        .btn-sm-edit{flex:1;padding:7px;background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.25);border-radius:10px;color:#60a5fa;font-size:0.8rem;font-weight:600;cursor:pointer;text-align:center;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:5px;}
        .btn-sm-edit:hover{background:rgba(96,165,250,0.25);color:#fff;transform:scale(1.03);}
        .btn-sm-del{flex:1;padding:7px;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);border-radius:10px;color:#f87171;font-size:0.8rem;font-weight:600;cursor:pointer;text-align:center;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:5px;}
        .btn-sm-del:hover{background:rgba(248,113,113,0.25);color:#fff;transform:scale(1.03);}
        .empty-state{text-align:center;padding:5rem;color:var(--text-muted);}
        /* MODAL */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
        .modal-overlay.show{display:flex;}
        .modal-box{background:#0f0e2a;border:1px solid var(--border);border-radius:24px;width:100%;max-width:520px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,0.6);animation:popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275);}
        @keyframes popIn{from{transform:scale(0.9) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
        .modal-header{background:linear-gradient(135deg,rgba(5,150,105,0.25),rgba(14,165,233,0.15));padding:1.75rem 2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
        .modal-title{font-size:1.3rem;font-weight:800;}
        .modal-close{background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer;transition:color 0.2s;}
        .modal-close:hover{color:#fff;}
        .modal-body{padding:1.75rem 2rem;}
        .field-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem;}
        .field-group{margin-bottom:1.25rem;}
        .field-label{font-size:0.78rem;font-weight:700;color:rgba(255,255,255,0.65);text-transform:uppercase;letter-spacing:1px;margin-bottom:0.5rem;display:block;}
        .field-input{width:100%;padding:0.75rem 1rem;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;color:#fff;font-size:0.9rem;font-family:'Inter',sans-serif;transition:all 0.3s;outline:none;}
        .field-input:focus{border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,0.2);}
        .field-input::placeholder{color:var(--text-muted);}
        .field-select option{background:#1a1535;}
        .modal-footer{padding:1.25rem 2rem;border-top:1px solid var(--border);display:flex;gap:1rem;}
        .btn-save{flex:1;padding:0.8rem;background:linear-gradient(135deg,#059669,#0ea5e9);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:0.9rem;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 20px rgba(5,150,105,0.4);}
        .btn-save:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(5,150,105,0.6);}
        .btn-cancel{padding:0.8rem 1.5rem;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;color:rgba(255,255,255,0.7);font-weight:600;font-size:0.9rem;cursor:pointer;transition:all 0.3s;}
        .btn-cancel:hover{background:rgba(255,255,255,0.1);color:#fff;}
        .toast{position:fixed;bottom:2rem;right:2rem;z-index:999;padding:1rem 1.5rem;border-radius:14px;font-weight:600;font-size:0.875rem;display:none;align-items:center;gap:0.75rem;animation:slideUp 0.3s ease;}
        .toast.show{display:flex;}
        .toast.success{background:rgba(5,150,105,0.9);border:1px solid rgba(52,211,153,0.4);}
        .toast.error{background:rgba(220,38,38,0.9);border:1px solid rgba(248,113,113,0.4);}
        @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-text"><i class="bi bi-trophy-fill me-2"></i>FutbolManager</div>
        <div class="logo-sub">API REST</div>
    </div>
    <div class="nav-section">
        <div class="nav-section-title">Principal</div>
        <a href="futbolistas.html" class="nav-item"><i class="bi bi-person-running"></i> Futbolistas</a>
        <a href="clubes.html" class="nav-item"><i class="bi bi-shield-fill"></i> Clubes</a>
        <a href="entrenadores.html" class="nav-item active"><i class="bi bi-person-fill"></i> Entrenadores</a>
    </div>
    <div class="nav-section mt-auto" style="padding-bottom:0.5rem;">
        <div class="nav-item" style="color:var(--text-muted);font-size:0.78rem;cursor:default;"><i class="bi bi-database"></i> MongoDB Atlas</div>
        <div class="nav-item" style="color:var(--text-muted);font-size:0.78rem;cursor:default;"><i class="bi bi-braces"></i> API REST activa</div>
    </div>
</aside>
<main class="main">
    <div class="topbar">
        <div>
            <div class="page-title">Cuerpo <span>Técnico</span></div>
            <div class="page-sub">Gestión de entrenadores · <code style="color:#34d399;background:rgba(52,211,153,0.1);padding:2px 8px;border-radius:6px;">GET /api/entrenadores</code></div>
        </div>
        <button class="btn-add" onclick="abrirModal()"><i class="bi bi-plus-lg"></i> Nuevo Entrenador</button>
    </div>
    <div class="cards-grid" id="cards-grid">
        <div class="empty-state" style="grid-column:1/-1"><i class="bi bi-arrow-repeat bi-spin d-block mb-2" style="font-size:2rem;"></i>Cargando...</div>
    </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title" id="modal-title">👨‍💼 Nuevo Entrenador</div>
            <button class="modal-close" onclick="cerrarModal()">×</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="ent-id"/>
            <div class="field-row">
                <div>
                    <label class="field-label"><i class="bi bi-person me-1"></i>Nombre</label>
                    <input class="field-input" id="ent-nombre" placeholder="Ej: Diego"/>
                </div>
                <div>
                    <label class="field-label"><i class="bi bi-person-badge me-1"></i>Apellido</label>
                    <input class="field-input" id="ent-apellido" placeholder="Ej: Simeone"/>
                </div>
            </div>
            <div class="field-row">
                <div>
                    <label class="field-label"><i class="bi bi-calendar me-1"></i>Edad</label>
                    <input class="field-input" id="ent-edad" type="number" placeholder="53" min="18" max="99"/>
                </div>
                <div>
                    <label class="field-label"><i class="bi bi-globe2 me-1"></i>Nacionalidad</label>
                    <input class="field-input" id="ent-nacionalidad" placeholder="Ej: Argentina"/>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-save" onclick="guardar()"><i class="bi bi-check-lg me-1"></i>Guardar</button>
            <button class="btn-cancel" onclick="cerrarModal()"><i class="bi bi-x me-1"></i>Cancelar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/entrenadores';
let data = [];

async function cargar() {
    try {
        const res = await fetch(API);
        data = await res.json();
        renderCards();
    } catch(e) { showToast('Error al conectar con la API', 'error'); }
}

function renderCards() {
    const grid = document.getElementById('cards-grid');
    if (!data.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="bi bi-people display-4 d-block mb-3"></i><p>No hay entrenadores registrados</p></div>`;
        return;
    }
    grid.innerHTML = data.map((e, i) => `
        <div class="coach-card" style="animation:fadeUp 0.4s ease ${i*0.07}s both">
            <div class="coach-avatar">${e.nombre ? e.nombre[0].toUpperCase() : '?'}</div>
            <div class="coach-name">${e.nombre} ${e.apellido}</div>
            <div class="coach-meta">
                <span class="meta-tag"><i class="bi bi-calendar2"></i> ${e.edad} años</span>
                <span class="meta-tag green"><i class="bi bi-globe2"></i> ${e.nacionalidad || '—'}</span>
            </div>
            <div class="coach-actions">
                <button class="btn-sm-edit" onclick='editarModal(${JSON.stringify(e).replace(/'/g,"\\'")})'><i class="bi bi-pencil-fill"></i> Editar</button>
                <button class="btn-sm-del" onclick="eliminar('${e.id}')"><i class="bi bi-trash-fill"></i> Eliminar</button>
            </div>
        </div>`).join('');
}

function abrirModal(e = null) {
    document.getElementById('modal-title').textContent = e ? '✏️ Editar Entrenador' : '👨‍💼 Nuevo Entrenador';
    document.getElementById('ent-id').value = e?.id || '';
    document.getElementById('ent-nombre').value = e?.nombre || '';
    document.getElementById('ent-apellido').value = e?.apellido || '';
    document.getElementById('ent-edad').value = e?.edad || '';
    document.getElementById('ent-nacionalidad').value = e?.nacionalidad || '';
    document.getElementById('modal').classList.add('show');
}
function editarModal(e) { abrirModal(e); }
function cerrarModal() { document.getElementById('modal').classList.remove('show'); }

async function guardar() {
    const id = document.getElementById('ent-id').value;
    const body = {
        nombre: document.getElementById('ent-nombre').value.trim(),
        apellido: document.getElementById('ent-apellido').value.trim(),
        edad: parseInt(document.getElementById('ent-edad').value),
        nacionalidad: document.getElementById('ent-nacionalidad').value.trim()
    };
    if (!body.nombre || !body.apellido) { showToast('Nombre y apellido son requeridos', 'error'); return; }
    try {
        const url = id ? `${API}/${id}` : API;
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        if (res.ok) { cerrarModal(); showToast(id ? 'Entrenador actualizado ✓' : 'Entrenador creado ✓', 'success'); cargar(); }
        else showToast('Error al guardar', 'error');
    } catch(e) { showToast('Error de conexión', 'error'); }
}

async function eliminar(id) {
    if (!confirm('¿Eliminar este entrenador?')) return;
    try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        if (res.ok) { showToast('Entrenador eliminado', 'success'); cargar(); }
        else showToast('Error al eliminar', 'error');
    } catch(e) { showToast('Error de conexión', 'error'); }
}

function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('modal').addEventListener('click', e => { if(e.target === document.getElementById('modal')) cerrarModal(); });
cargar();

// CANVAS
const canvas=document.getElementById('bg-canvas'),ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
const pts=Array.from({length:50},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,dx:(Math.random()-.5)*.4,dy:(Math.random()-.5)*.4,r:Math.random()*1.2+.3,a:Math.random()*.4+.1}));
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(52,211,153,${p.a})`;ctx.fill();p.x+=p.dx;p.y+=p.dy;if(p.x<0||p.x>canvas.width)p.dx*=-1;if(p.y<0||p.y>canvas.height)p.dy*=-1;});requestAnimationFrame(draw);}
draw();
</script>
<style>@keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}</style>
</body>
</html>
