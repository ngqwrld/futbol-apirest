<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clubes · FutbolManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        :root{--accent:#7c3aed;--accent2:#2563eb;--border:rgba(255,255,255,0.08);--text-muted:rgba(255,255,255,0.4);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#060612;color:#fff;min-height:100vh;overflow-x:hidden;}
        #bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
        .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:rgba(10,8,30,0.9);backdrop-filter:blur(20px);border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;padding:1.5rem 0;}
        .sidebar-logo{padding:0 1.5rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem;}
        .logo-text{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#7c3aed,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .logo-sub{font-size:0.7rem;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;}
        .nav-section{padding:0 0.75rem;margin-bottom:0.5rem;}
        .nav-section-title{font-size:0.65rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;padding:0 0.75rem;margin-bottom:0.5rem;}
        .nav-item{display:flex;align-items:center;gap:0.75rem;padding:0.65rem 0.75rem;border-radius:10px;color:rgba(255,255,255,0.6);font-size:0.875rem;font-weight:500;text-decoration:none;transition:all 0.2s;margin-bottom:2px;}
        .nav-item:hover{background:rgba(255,255,255,0.04);color:#fff;}
        .nav-item.active{background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(37,99,235,0.3));color:#fff;border:1px solid rgba(124,58,237,0.3);}
        .nav-item i{font-size:1rem;width:20px;text-align:center;}
        .main{margin-left:240px;padding:2rem;position:relative;z-index:1;}
        .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
        .page-title{font-size:1.75rem;font-weight:800;}
        .page-title span{background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .page-sub{color:var(--text-muted);font-size:0.85rem;margin-top:2px;}
        .btn-primary-custom{background:linear-gradient(135deg,#7c3aed,#2563eb);border:none;border-radius:12px;padding:10px 22px;font-weight:600;font-size:0.875rem;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 0.3s;box-shadow:0 4px 20px rgba(124,58,237,0.4);}
        .btn-primary-custom:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(124,58,237,0.6);}
        .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem;}
        .stat-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:16px;padding:1.5rem;display:flex;align-items:center;gap:1rem;transition:all 0.3s;}
        .stat-card:hover{transform:translateY(-4px);border-color:rgba(124,58,237,0.4);}
        .stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
        .stat-icon.purple{background:rgba(124,58,237,0.2);color:#a78bfa;}
        .stat-icon.blue{background:rgba(37,99,235,0.2);color:#60a5fa;}
        .stat-icon.green{background:rgba(5,150,105,0.2);color:#34d399;}
        .stat-value{font-size:1.8rem;font-weight:800;line-height:1;}
        .stat-label{color:var(--text-muted);font-size:0.8rem;margin-top:2px;}
        .table-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.3);}
        .table-card-header{padding:1.25rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
        .table-card-title{font-weight:700;font-size:0.95rem;}
        .badge-count{background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);color:#a78bfa;border-radius:20px;padding:2px 12px;font-size:0.75rem;font-weight:600;}
        .table{color:#fff;margin:0;}
        .table thead th{background:rgba(255,255,255,0.03);border-color:var(--border);color:var(--text-muted);font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:0.9rem 1.5rem;}
        .table tbody tr{border-color:var(--border);transition:all 0.2s;background:transparent;}
        .table tbody tr:hover{background:rgba(124,58,237,0.08);}
        .table tbody td{padding:1rem 1.5rem;vertical-align:middle;border-color:var(--border);background-color:transparent !important;color:rgba(255,255,255,0.9);}
        .table{--bs-table-bg:transparent;--bs-table-hover-bg:rgba(124,58,237,0.08);color:rgba(255,255,255,0.9);}
        .id-chip{font-family:'Courier New',monospace;font-size:0.68rem;color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.08);border-radius:6px;padding:3px 8px;}
        .club-name{font-weight:600;font-size:0.95rem;color:#fff;}
        .club-meta{font-size:0.78rem;color:rgba(255,255,255,0.6);}
        .entrenador-pill{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(37,99,235,0.2));border:1px solid rgba(124,58,237,0.3);border-radius:20px;padding:4px 12px;font-size:0.8rem;font-weight:500;color:#c4b5fd;}
        .no-entrenador{color:var(--text-muted);font-size:0.85rem;}
        .action-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:0.8rem;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:5px;}
        .action-btn.edit{color:#60a5fa;border-color:rgba(96,165,250,0.3);}
        .action-btn.edit:hover{background:rgba(96,165,250,0.15);border-color:#60a5fa;color:#fff;}
        .action-btn.del{color:#f87171;border-color:rgba(248,113,113,0.3);}
        .action-btn.del:hover{background:rgba(248,113,113,0.15);border-color:#f87171;color:#fff;}
        /* MODAL */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
        .modal-overlay.show{display:flex;}
        .modal-box{background:#0f0e2a;border:1px solid var(--border);border-radius:24px;width:100%;max-width:540px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,0.6);animation:popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275);}
        @keyframes popIn{from{transform:scale(0.9) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
        .modal-header{background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(37,99,235,0.2));padding:1.75rem 2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
        .modal-title{font-size:1.3rem;font-weight:800;}
        .modal-close{background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer;}
        .modal-close:hover{color:#fff;}
        .modal-body{padding:1.75rem 2rem;}
        .field-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem;}
        .field-group{margin-bottom:1.25rem;}
        .field-label{font-size:0.78rem;font-weight:700;color:rgba(255,255,255,0.65);text-transform:uppercase;letter-spacing:1px;margin-bottom:0.5rem;display:block;}
        .field-input{width:100%;padding:0.75rem 1rem;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;color:#fff;font-size:0.9rem;font-family:'Inter',sans-serif;transition:all 0.3s;outline:none;}
        .field-input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,0.2);}
        .field-input::placeholder{color:var(--text-muted);}
        .field-select option{background:#1a1535;}
        .modal-footer{padding:1.25rem 2rem;border-top:1px solid var(--border);display:flex;gap:1rem;}
        .btn-save{flex:1;padding:0.8rem;background:linear-gradient(135deg,#7c3aed,#2563eb);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:0.9rem;cursor:pointer;transition:all 0.3s;}
        .btn-save:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(124,58,237,0.5);}
        .btn-cancel{padding:0.8rem 1.5rem;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;color:rgba(255,255,255,0.7);font-weight:600;font-size:0.9rem;cursor:pointer;transition:all 0.3s;}
        .btn-cancel:hover{background:rgba(255,255,255,0.1);color:#fff;}
        .toast{position:fixed;bottom:2rem;right:2rem;z-index:999;padding:1rem 1.5rem;border-radius:14px;font-weight:600;font-size:0.875rem;display:none;align-items:center;gap:0.75rem;}
        .toast.show{display:flex;}
        .toast.success{background:rgba(5,150,105,0.9);border:1px solid rgba(52,211,153,0.4);}
        .toast.error{background:rgba(220,38,38,0.9);border:1px solid rgba(248,113,113,0.4);}
    </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-text"><i class="bi bi-trophy-fill me-2"></i>FutbolManager</div>
        <div class="logo-sub">API REST</div>
    </div>
    <div class="nav-section">
        <div class="nav-section-title">Principal</div>
        <a href="futbolistas.html" class="nav-item"><i class="bi bi-person-running"></i> Futbolistas</a>
        <a href="clubes.html" class="nav-item active"><i class="bi bi-shield-fill"></i> Clubes</a>
        <a href="entrenadores.html" class="nav-item"><i class="bi bi-person-fill"></i> Entrenadores</a>
    </div>
    <div class="nav-section mt-auto" style="padding-bottom:0.5rem;">
        <div class="nav-item" style="color:var(--text-muted);font-size:0.78rem;cursor:default;"><i class="bi bi-database"></i> MongoDB Atlas</div>
        <div class="nav-item" style="color:var(--text-muted);font-size:0.78rem;cursor:default;"><i class="bi bi-link-45deg"></i> @DocumentReference</div>
    </div>
</aside>
<main class="main">
    <div class="topbar">
        <div>
            <div class="page-title">Clubes <span>de Fútbol</span></div>
            <div class="page-sub">Gestión de clubes · <code style="color:#a78bfa;background:rgba(124,58,237,0.1);padding:2px 8px;border-radius:6px;">GET /api/clubes</code></div>
        </div>
        <button class="btn-primary-custom" onclick="abrirModal()"><i class="bi bi-plus-lg"></i> Nuevo Club</button>
    </div>
    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon purple"><i class="bi bi-shield-fill"></i></div><div><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total clubes</div></div></div>
        <div class="stat-card"><div class="stat-icon green"><i class="bi bi-person-check-fill"></i></div><div><div class="stat-value" id="stat-con">—</div><div class="stat-label">Con entrenador</div></div></div>
        <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-person-dash-fill"></i></div><div><div class="stat-value" id="stat-sin">—</div><div class="stat-label">Sin entrenador</div></div></div>
    </div>
    <!-- TABLE -->
    <div class="table-card">
        <div class="table-card-header">
            <span class="table-card-title"><i class="bi bi-table me-2"></i>Lista de Clubes</span>
            <span class="badge-count" id="badge-count">0 registros</span>
        </div>
        <table class="table">
            <thead><tr><th>ID</th><th>Club</th><th>País / Ciudad</th><th>Entrenador</th><th class="text-end">Acciones</th></tr></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title" id="modal-title">🏟️ Nuevo Club</div>
            <button class="modal-close" onclick="cerrarModal()">×</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="club-id"/>
            <div class="field-group">
                <label class="field-label"><i class="bi bi-shield me-1"></i>Nombre del club</label>
                <input class="field-input" id="club-nombre" placeholder="Ej: Real Madrid CF"/>
            </div>
            <div class="field-row">
                <div>
                    <label class="field-label"><i class="bi bi-geo-alt me-1"></i>Ciudad</label>
                    <input class="field-input" id="club-ciudad" placeholder="Ej: Madrid"/>
                </div>
                <div>
                    <label class="field-label"><i class="bi bi-globe me-1"></i>País</label>
                    <input class="field-input" id="club-pais" placeholder="Ej: España"/>
                </div>
            </div>
            <div class="field-row">
                <div>
                    <label class="field-label"><i class="bi bi-calendar me-1"></i>Año fundación</label>
                    <input class="field-input" id="club-anio" type="number" placeholder="Ej: 1902" min="1800" max="2026"/>
                </div>
                <div>
                    <label class="field-label"><i class="bi bi-person me-1"></i>Entrenador <span style="color:var(--text-muted);text-transform:none;letter-spacing:0;">(@DocumentReference)</span></label>
                    <select class="field-input field-select" id="club-entrenador">
                        <option value="">— Sin entrenador —</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-save" onclick="guardar()"><i class="bi bi-check-lg me-1"></i>Guardar Club</button>
            <button class="btn-cancel" onclick="cerrarModal()"><i class="bi bi-x me-1"></i>Cancelar</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
let data = [], entrenadores = [];

async function cargar() {
    try {
        const [resC, resE] = await Promise.all([fetch('/api/clubes'), fetch('/api/entrenadores')]);
        data = await resC.json();
        entrenadores = await resE.json();
        renderTabla();
        renderStats();
    } catch(e) { showToast('Error al conectar con la API', 'error'); }
}

function renderStats() {
    const con = data.filter(c => c.entrenador).length;
    document.getElementById('stat-total').textContent = data.length;
    document.getElementById('stat-con').textContent = con;
    document.getElementById('stat-sin').textContent = data.length - con;
    document.getElementById('badge-count').textContent = data.length + ' registros';
}

function renderTabla() {
    const tbody = document.getElementById('tbody');
    if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:3rem;color:var(--text-muted);"><i class="bi bi-inbox d-block mb-2" style="font-size:2rem;"></i>No hay clubes registrados</td></tr>`;
        return;
    }
    tbody.innerHTML = data.map(c => `
        <tr>
            <td><span class="id-chip">${c.id?.substring(0,10)}…</span></td>
            <td>
                <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#2563eb);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.85rem;">${c.nombre?.[0]?.toUpperCase()||'?'}</div>
                    <div><div class="club-name">${c.nombre}</div><div class="club-meta">${c.anioFundacion ? 'Fundado '+c.anioFundacion : ''}</div></div>
                </div>
            </td>
            <td><span style="font-size:0.85rem;">${c.ciudad||'—'}, ${c.pais||'—'}</span></td>
            <td>
                ${c.entrenador
                    ? `<span class="entrenador-pill"><i class="bi bi-person-fill"></i>${c.entrenador.nombre} ${c.entrenador.apellido}</span>`
                    : `<span class="no-entrenador"><i class="bi bi-dash-circle me-1"></i>Sin asignar</span>`}
            </td>
            <td class="text-end">
                <button class="action-btn edit me-1" onclick='editarModal(${JSON.stringify(c).replace(/'/g,"\\'")})'><i class="bi bi-pencil-fill"></i> Editar</button>
                <button class="action-btn del" onclick="eliminar('${c.id}')"><i class="bi bi-trash-fill"></i> Eliminar</button>
            </td>
        </tr>`).join('');
}

function poblarSelectEntrenadores(selId = '') {
    const sel = document.getElementById('club-entrenador');
    sel.innerHTML = '<option value="">— Sin entrenador —</option>' +
        entrenadores.map(e => `<option value="${e.id}" ${e.id === selId ? 'selected' : ''}>${e.nombre} ${e.apellido}</option>`).join('');
}

function abrirModal(c = null) {
    document.getElementById('modal-title').textContent = c ? '✏️ Editar Club' : '🏟️ Nuevo Club';
    document.getElementById('club-id').value = c?.id || '';
    document.getElementById('club-nombre').value = c?.nombre || '';
    document.getElementById('club-ciudad').value = c?.ciudad || '';
    document.getElementById('club-pais').value = c?.pais || '';
    document.getElementById('club-anio').value = c?.anioFundacion || '';
    poblarSelectEntrenadores(c?.entrenador?.id || '');
    document.getElementById('modal').classList.add('show');
}
function editarModal(c) { abrirModal(c); }
function cerrarModal() { document.getElementById('modal').classList.remove('show'); }

async function guardar() {
    const id = document.getElementById('club-id').value;
    const body = {
        nombre: document.getElementById('club-nombre').value.trim(),
        ciudad: document.getElementById('club-ciudad').value.trim(),
        pais: document.getElementById('club-pais').value.trim(),
        anioFundacion: parseInt(document.getElementById('club-anio').value) || 0,
        entrenadorId: document.getElementById('club-entrenador').value || null
    };
    if (!body.nombre) { showToast('El nombre es requerido', 'error'); return; }
    try {
        const url = id ? `/api/clubes/${id}` : '/api/clubes';
        const res = await fetch(url, { method: id ? 'PUT' : 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
        if (res.ok) { cerrarModal(); showToast(id ? 'Club actualizado ✓' : 'Club creado ✓', 'success'); cargar(); }
        else showToast('Error al guardar', 'error');
    } catch(e) { showToast('Error de conexión', 'error'); }
}

async function eliminar(id) {
    if (!confirm('¿Eliminar este club?')) return;
    try {
        const res = await fetch(`/api/clubes/${id}`, { method: 'DELETE' });
        if (res.ok) { showToast('Club eliminado', 'success'); cargar(); }
        else showToast('Error al eliminar', 'error');
    } catch(e) { showToast('Error de conexión', 'error'); }
}

function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
}

document.getElementById('modal').addEventListener('click', e => { if(e.target===document.getElementById('modal')) cerrarModal(); });
cargar();

const canvas=document.getElementById('bg-canvas'),ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
const pts=Array.from({length:50},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,dx:(Math.random()-.5)*.4,dy:(Math.random()-.5)*.4,r:Math.random()*1.2+.3,a:Math.random()*.4+.1}));
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(167,139,250,${p.a})`;ctx.fill();p.x+=p.dx;p.y+=p.dy;if(p.x<0||p.x>canvas.width)p.dx*=-1;if(p.y<0||p.y>canvas.height)p.dy*=-1;});requestAnimationFrame(draw);}
draw();
</script>
</body>
</html>
