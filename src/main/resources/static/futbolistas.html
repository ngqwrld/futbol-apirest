<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Futbolistas · FutbolManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        :root{--accent:#7c3aed;--accent2:#2563eb;--border:rgba(255,255,255,0.08);--text-muted:rgba(255,255,255,0.4);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#060612;color:#fff;min-height:100vh;overflow-x:hidden;}
        #bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
        .sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:rgba(10,8,30,0.9);backdrop-filter:blur(20px);border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;padding:1.5rem 0;}
        .sidebar-logo{padding:0 1.5rem 1.5rem;border-bottom:1px solid var(--border);margin-bottom:1rem;}
        .logo-text{font-size:1.1rem;font-weight:800;background:linear-gradient(135deg,#7c3aed,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .logo-sub{font-size:0.7rem;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase;}
        .nav-section{padding:0 0.75rem;margin-bottom:0.5rem;}
        .nav-section-title{font-size:0.65rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;padding:0 0.75rem;margin-bottom:0.5rem;}
        .nav-item{display:flex;align-items:center;gap:0.75rem;padding:0.65rem 0.75rem;border-radius:10px;color:rgba(255,255,255,0.6);font-size:0.875rem;font-weight:500;text-decoration:none;transition:all 0.2s;margin-bottom:2px;}
        .nav-item:hover{background:rgba(255,255,255,0.04);color:#fff;}
        .nav-item.active{background:linear-gradient(135deg,rgba(124,58,237,0.3),rgba(37,99,235,0.3));color:#fff;border:1px solid rgba(124,58,237,0.3);}
        .nav-item i{font-size:1rem;width:20px;text-align:center;}
        .main{margin-left:240px;padding:2rem;position:relative;z-index:1;}
        .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;}
        .page-title{font-size:1.75rem;font-weight:800;}
        .page-title span{background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .page-sub{color:var(--text-muted);font-size:0.85rem;margin-top:2px;}
        .btn-add-player{background:linear-gradient(135deg,#f59e0b,#ef4444);border:none;border-radius:12px;padding:10px 22px;font-weight:600;font-size:0.875rem;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 0.3s;box-shadow:0 4px 20px rgba(245,158,11,0.4);}
        .btn-add-player:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(245,158,11,0.6);}
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;}
        .stat-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:16px;padding:1.25rem;display:flex;align-items:center;gap:1rem;transition:all 0.3s;}
        .stat-card:hover{transform:translateY(-4px);border-color:rgba(245,158,11,0.4);}
        .stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
        .stat-icon.orange{background:rgba(245,158,11,0.2);color:#fbbf24;}
        .stat-icon.red{background:rgba(239,68,68,0.2);color:#f87171;}
        .stat-icon.purple{background:rgba(124,58,237,0.2);color:#a78bfa;}
        .stat-icon.blue{background:rgba(37,99,235,0.2);color:#60a5fa;}
        .stat-value{font-size:1.6rem;font-weight:800;line-height:1;}
        .stat-label{color:var(--text-muted);font-size:0.75rem;margin-top:2px;}
        /* FILTER BAR */
        .filter-bar{display:flex;gap:0.75rem;margin-bottom:1.5rem;flex-wrap:wrap;}
        .filter-btn{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:6px 16px;font-size:0.8rem;font-weight:600;color:rgba(255,255,255,0.6);cursor:pointer;transition:all 0.2s;}
        .filter-btn:hover,.filter-btn.active{background:rgba(245,158,11,0.15);border-color:rgba(245,158,11,0.4);color:#fbbf24;}
        /* CARDS GRID */
        .players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem;}
        .player-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:20px;overflow:hidden;transition:all 0.35s cubic-bezier(0.175,0.885,0.32,1.275);position:relative;}
        .player-card:hover{transform:translateY(-8px);border-color:rgba(245,158,11,0.4);box-shadow:0 20px 50px rgba(0,0,0,0.4);}
        .player-card-top{background:linear-gradient(135deg,rgba(245,158,11,0.2),rgba(239,68,68,0.1));padding:1.5rem;position:relative;}
        .player-dorsal{position:absolute;top:1rem;right:1rem;font-size:2rem;font-weight:900;color:rgba(255,255,255,0.15);}
        .player-avatar{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:900;color:#fff;margin-bottom:0.75rem;box-shadow:0 6px 15px rgba(245,158,11,0.3);}
        .player-name{font-size:1rem;font-weight:700;}
        .player-pos{display:inline-block;margin-top:0.3rem;}
        .pos-badge{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 10px;font-size:0.72rem;font-weight:700;}
        .pos-portero{background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);color:#a78bfa;}
        .pos-defensa{background:rgba(37,99,235,0.2);border:1px solid rgba(37,99,235,0.3);color:#60a5fa;}
        .pos-centrocampista{background:rgba(5,150,105,0.2);border:1px solid rgba(5,150,105,0.3);color:#34d399;}
        .pos-delantero{background:rgba(245,158,11,0.2);border:1px solid rgba(245,158,11,0.3);color:#fbbf24;}
        .player-card-body{padding:1rem 1.5rem 1.5rem;}
        .player-info{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;}
        .info-tag{background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:8px;padding:3px 9px;font-size:0.72rem;color:rgba(255,255,255,0.65);display:flex;align-items:center;gap:4px;}
        .club-tag{background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.25);border-radius:8px;padding:3px 9px;font-size:0.72rem;color:#c4b5fd;display:flex;align-items:center;gap:4px;margin-bottom:1rem;}
        .valor-tag{font-size:1.1rem;font-weight:800;color:#fbbf24;margin-bottom:1rem;}
        .player-actions{display:flex;gap:0.5rem;}
        .btn-sm-edit{flex:1;padding:7px;background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.25);border-radius:10px;color:#60a5fa;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:5px;}
        .btn-sm-edit:hover{background:rgba(96,165,250,0.25);color:#fff;}
        .btn-sm-del{flex:1;padding:7px;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);border-radius:10px;color:#f87171;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:5px;}
        .btn-sm-del:hover{background:rgba(248,113,113,0.25);color:#fff;}
        /* MODAL */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
        .modal-overlay.show{display:flex;}
        .modal-box{background:#0f0e2a;border:1px solid var(--border);border-radius:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 40px 80px rgba(0,0,0,0.6);animation:popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275);}
        @keyframes popIn{from{transform:scale(0.9) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
        .modal-header{background:linear-gradient(135deg,rgba(245,158,11,0.25),rgba(239,68,68,0.15));padding:1.75rem 2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1;}
        .modal-title{font-size:1.3rem;font-weight:800;}
        .modal-close{background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer;}
        .modal-close:hover{color:#fff;}
        .modal-body{padding:1.75rem 2rem;}
        .field-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem;}
        .field-group{margin-bottom:1.25rem;}
        .field-label{font-size:0.78rem;font-weight:700;color:rgba(255,255,255,0.65);text-transform:uppercase;letter-spacing:1px;margin-bottom:0.5rem;display:block;}
        .field-input{width:100%;padding:0.75rem 1rem;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;color:#fff;font-size:0.9rem;font-family:'Inter',sans-serif;transition:all 0.3s;outline:none;}
        .field-input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,0.2);}
        .field-input::placeholder{color:var(--text-muted);}
        .field-select option{background:#1a1535;}
        .modal-footer{padding:1.25rem 2rem;border-top:1px solid var(--border);display:flex;gap:1rem;position:sticky;bottom:0;background:#0f0e2a;}
        .btn-save{flex:1;padding:0.8rem;background:linear-gradient(135deg,#f59e0b,#ef4444);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:0.9rem;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 20px rgba(245,158,11,0.4);}
        .btn-save:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(245,158,11,0.6);}
        .btn-cancel{padding:0.8rem 1.5rem;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;color:rgba(255,255,255,0.7);font-weight:600;font-size:0.9rem;cursor:pointer;transition:all 0.3s;}
        .btn-cancel:hover{background:rgba(255,255,255,0.1);color:#fff;}
        .toast{position:fixed;bottom:2rem;right:2rem;z-index:999;padding:1rem 1.5rem;border-radius:14px;font-weight:600;font-size:0.875rem;display:none;align-items:center;gap:0.75rem;}
        .toast.show{display:flex;}
        .toast.success{background:rgba(5,150,105,0.9);border:1px solid rgba(52,211,153,0.4);}
        .toast.error{background:rgba(220,38,38,0.9);border:1px solid rgba(248,113,113,0.4);}
        @keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
        .empty-state{text-align:center;padding:5rem;color:var(--text-muted);grid-column:1/-1;}
    </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-text"><i class="bi bi-trophy-fill me-2"></i>FutbolManager</div>
        <div class="logo-sub">API REST</div>
    </div>
    <div class="nav-section">
        <div class="nav-section-title">Principal</div>
        <a href="futbolistas.html" class="nav-item active"><i class="bi bi-person-running"></i> Futbolistas</a>
        <a href="clubes.html" class="nav-item"><i class="bi bi-shield-fill"></i> Clubes</a>
        <a href="entrenadores.html" class="nav-item"><i class="bi bi-person-fill"></i> Entrenadores</a>
    </div>
    <div class="nav-section mt-auto" style="padding-bottom:0.5rem;">
        <div class="nav-item" style="color:var(--text-muted);font-size:0.78rem;cursor:default;"><i class="bi bi-database"></i> MongoDB Atlas</div>
        <div class="nav-item" style="color:var(--text-muted);font-size:0.78rem;cursor:default;"><i class="bi bi-braces"></i> API REST activa</div>
    </div>
</aside>
<main class="main">
    <div class="topbar">
        <div>
            <div class="page-title">Jugadores <span>⚽</span></div>
            <div class="page-sub">Gestión de futbolistas · <code style="color:#fbbf24;background:rgba(245,158,11,0.1);padding:2px 8px;border-radius:6px;">GET /api/futbolistas</code></div>
        </div>
        <button class="btn-add-player" onclick="abrirModal()"><i class="bi bi-plus-lg"></i> Nuevo Jugador</button>
    </div>
    <!-- STATS -->
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon orange"><i class="bi bi-people-fill"></i></div><div><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total jugadores</div></div></div>
        <div class="stat-card"><div class="stat-icon red"><i class="bi bi-bullseye"></i></div><div><div class="stat-value" id="stat-del">—</div><div class="stat-label">Delanteros</div></div></div>
        <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-shield-fill"></i></div><div><div class="stat-value" id="stat-def">—</div><div class="stat-label">Defensas</div></div></div>
        <div class="stat-card"><div class="stat-icon purple"><i class="bi bi-currency-euro"></i></div><div><div class="stat-value" id="stat-valor">—</div><div class="stat-label">Valor total (M€)</div></div></div>
    </div>
    <!-- FILTROS -->
    <div class="filter-bar">
        <button class="filter-btn active" onclick="filtrar(this,'')">Todos</button>
        <button class="filter-btn" onclick="filtrar(this,'Portero')">🧤 Porteros</button>
        <button class="filter-btn" onclick="filtrar(this,'Defensa')">🛡️ Defensas</button>
        <button class="filter-btn" onclick="filtrar(this,'Centrocampista')">⚙️ Centrocampistas</button>
        <button class="filter-btn" onclick="filtrar(this,'Delantero')">⚡ Delanteros</button>
    </div>
    <div class="players-grid" id="players-grid">
        <div class="empty-state"><i class="bi bi-arrow-repeat d-block mb-2" style="font-size:2rem;"></i>Cargando...</div>
    </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title" id="modal-title">🏃 Nuevo Jugador</div>
            <button class="modal-close" onclick="cerrarModal()">×</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="f-id"/>
            <div class="field-row">
                <div>
                    <label class="field-label">Nombre</label>
                    <input class="field-input" id="f-nombre" placeholder="Ej: Lionel"/>
                </div>
                <div>
                    <label class="field-label">Apellido</label>
                    <input class="field-input" id="f-apellido" placeholder="Ej: Messi"/>
                </div>
            </div>
            <div class="field-row">
                <div>
                    <label class="field-label">Edad</label>
                    <input class="field-input" id="f-edad" type="number" placeholder="27" min="15" max="50"/>
                </div>
                <div>
                    <label class="field-label">Nacionalidad</label>
                    <input class="field-input" id="f-nacionalidad" placeholder="Argentina"/>
                </div>
            </div>
            <div class="field-row">
                <div>
                    <label class="field-label">Posición</label>
                    <select class="field-input field-select" id="f-posicion">
                        <option value="">— Seleccionar —</option>
                        <option value="Portero">🧤 Portero</option>
                        <option value="Defensa">🛡️ Defensa</option>
                        <option value="Centrocampista">⚙️ Centrocampista</option>
                        <option value="Delantero">⚡ Delantero</option>
                    </select>
                </div>
                <div>
                    <label class="field-label">Dorsal</label>
                    <input class="field-input" id="f-dorsal" type="number" placeholder="10" min="1" max="99"/>
                </div>
            </div>
            <div class="field-row">
                <div>
                    <label class="field-label">Valor mercado (M€)</label>
                    <input class="field-input" id="f-valor" type="number" step="0.1" placeholder="80.5"/>
                </div>
                <div>
                    <label class="field-label">Club <span style="color:var(--text-muted);text-transform:none;letter-spacing:0;">(@DocumentRef)</span></label>
                    <select class="field-input field-select" id="f-club">
                        <option value="">— Sin club —</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-save" onclick="guardar()"><i class="bi bi-check-lg me-1"></i>Guardar Jugador</button>
            <button class="btn-cancel" onclick="cerrarModal()"><i class="bi bi-x me-1"></i>Cancelar</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
let data = [], clubes = [], filtroActivo = '';

const posClass = { Portero:'portero', Defensa:'defensa', Centrocampista:'centrocampista', Delantero:'delantero' };

async function cargar() {
    try {
        const [resF, resC] = await Promise.all([fetch('/api/futbolistas'), fetch('/api/clubes')]);
        data = await resF.json();
        clubes = await resC.json();
        renderStats();
        renderCards();
    } catch(e) { showToast('Error al conectar con la API', 'error'); }
}

function renderStats() {
    document.getElementById('stat-total').textContent = data.length;
    document.getElementById('stat-del').textContent = data.filter(f=>f.posicion==='Delantero').length;
    document.getElementById('stat-def').textContent = data.filter(f=>f.posicion==='Defensa').length;
    const total = data.reduce((s,f)=>s+(f.valorMercado||0),0);
    document.getElementById('stat-valor').textContent = total.toFixed(1);
}

function filtrar(btn, pos) {
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filtroActivo = pos;
    renderCards();
}

function renderCards() {
    const grid = document.getElementById('players-grid');
    const lista = filtroActivo ? data.filter(f=>f.posicion===filtroActivo) : data;
    if (!lista.length) {
        grid.innerHTML = `<div class="empty-state"><i class="bi bi-person-slash d-block mb-3" style="font-size:2.5rem;"></i><p>No hay jugadores ${filtroActivo ? 'en esta posición' : 'registrados'}</p></div>`;
        return;
    }
    grid.innerHTML = lista.map((f, i) => `
        <div class="player-card" style="animation:fadeUp 0.4s ease ${i*0.06}s both">
            <div class="player-card-top">
                <div class="player-dorsal">${f.dorsal||'—'}</div>
                <div class="player-avatar">${f.nombre?.[0]?.toUpperCase()||'?'}</div>
                <div class="player-name">${f.nombre} ${f.apellido}</div>
                <div class="player-pos"><span class="pos-badge pos-${posClass[f.posicion]||'defensa'}">${f.posicion||'—'}</span></div>
            </div>
            <div class="player-card-body">
                <div class="player-info">
                    <span class="info-tag"><i class="bi bi-calendar2"></i> ${f.edad} años</span>
                    <span class="info-tag"><i class="bi bi-globe2"></i> ${f.nacionalidad||'—'}</span>
                </div>
                ${f.club ? `<div class="club-tag"><i class="bi bi-shield-fill"></i> ${f.club.nombre}</div>` : `<div style="color:var(--text-muted);font-size:0.78rem;margin-bottom:1rem;"><i class="bi bi-dash-circle me-1"></i>Sin club</div>`}
                <div class="valor-tag">€ ${f.valorMercado ? f.valorMercado.toFixed(1)+'M' : '—'}</div>
                <div class="player-actions">
                    <button class="btn-sm-edit" onclick='editarModal(${JSON.stringify(f).replace(/'/g,"\\'")})'><i class="bi bi-pencil-fill"></i> Editar</button>
                    <button class="btn-sm-del" onclick="eliminar('${f.id}')"><i class="bi bi-trash-fill"></i> Eliminar</button>
                </div>
            </div>
        </div>`).join('');
}

function poblarSelectClubes(selId = '') {
    const sel = document.getElementById('f-club');
    sel.innerHTML = '<option value="">— Sin club —</option>' +
        clubes.map(c => `<option value="${c.id}" ${c.id===selId?'selected':''}>${c.nombre}</option>`).join('');
}

function abrirModal(f = null) {
    document.getElementById('modal-title').textContent = f ? '✏️ Editar Jugador' : '🏃 Nuevo Jugador';
    document.getElementById('f-id').value = f?.id||'';
    document.getElementById('f-nombre').value = f?.nombre||'';
    document.getElementById('f-apellido').value = f?.apellido||'';
    document.getElementById('f-edad').value = f?.edad||'';
    document.getElementById('f-nacionalidad').value = f?.nacionalidad||'';
    document.getElementById('f-posicion').value = f?.posicion||'';
    document.getElementById('f-dorsal').value = f?.dorsal||'';
    document.getElementById('f-valor').value = f?.valorMercado||'';
    poblarSelectClubes(f?.club?.id||'');
    document.getElementById('modal').classList.add('show');
}
function editarModal(f) { abrirModal(f); }
function cerrarModal() { document.getElementById('modal').classList.remove('show'); }

async function guardar() {
    const id = document.getElementById('f-id').value;
    const body = {
        nombre: document.getElementById('f-nombre').value.trim(),
        apellido: document.getElementById('f-apellido').value.trim(),
        edad: parseInt(document.getElementById('f-edad').value)||0,
        nacionalidad: document.getElementById('f-nacionalidad').value.trim(),
        posicion: document.getElementById('f-posicion').value,
        dorsal: parseInt(document.getElementById('f-dorsal').value)||0,
        valorMercado: parseFloat(document.getElementById('f-valor').value)||0,
        clubId: document.getElementById('f-club').value||null
    };
    if (!body.nombre || !body.apellido) { showToast('Nombre y apellido son requeridos', 'error'); return; }
    try {
        const url = id ? `/api/futbolistas/${id}` : '/api/futbolistas';
        const res = await fetch(url, { method: id?'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
        if (res.ok) { cerrarModal(); showToast(id?'Jugador actualizado ✓':'Jugador creado ✓','success'); cargar(); }
        else showToast('Error al guardar','error');
    } catch(e) { showToast('Error de conexión','error'); }
}

async function eliminar(id) {
    if (!confirm('¿Eliminar este jugador?')) return;
    try {
        const res = await fetch(`/api/futbolistas/${id}`,{method:'DELETE'});
        if (res.ok) { showToast('Jugador eliminado','success'); cargar(); }
        else showToast('Error al eliminar','error');
    } catch(e) { showToast('Error de conexión','error'); }
}

function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast ${type} show`;
    setTimeout(()=>t.classList.remove('show'), 3000);
}

document.getElementById('modal').addEventListener('click', e=>{ if(e.target===document.getElementById('modal')) cerrarModal(); });
cargar();

const canvas=document.getElementById('bg-canvas'),ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
const pts=Array.from({length:50},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,dx:(Math.random()-.5)*.4,dy:(Math.random()-.5)*.4,r:Math.random()*1.2+.3,a:Math.random()*.4+.1}));
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(251,191,36,${p.a})`;ctx.fill();p.x+=p.dx;p.y+=p.dy;if(p.x<0||p.x>canvas.width)p.dx*=-1;if(p.y<0||p.y>canvas.height)p.dy*=-1;});requestAnimationFrame(draw);}
draw();
</script>
