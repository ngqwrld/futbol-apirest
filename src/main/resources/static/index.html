<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FutbolManager · API REST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
        :root { --accent:#7c3aed; --accent2:#2563eb; --border:rgba(255,255,255,0.08); --text-muted:rgba(255,255,255,0.4); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#060612; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        #bg-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
        .hero { position:relative; z-index:1; text-align:center; padding:2rem; }
        .logo { font-size:4rem; margin-bottom:1rem; }
        .hero-title { font-size:3rem; font-weight:900; line-height:1.1; margin-bottom:1rem; }
        .hero-title span { background:linear-gradient(135deg,#a78bfa,#60a5fa,#34d399); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .hero-sub { color:var(--text-muted); font-size:1rem; margin-bottom:3rem; }
        .nav-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem; max-width:700px; margin:0 auto; }
        .nav-card {
            background:rgba(255,255,255,0.04);
            border:1px solid var(--border);
            border-radius:20px; padding:2rem 1.5rem;
            text-decoration:none; color:#fff;
            transition:all 0.35s cubic-bezier(0.175,0.885,0.32,1.275);
            display:flex; flex-direction:column; align-items:center; gap:0.75rem;
        }
        .nav-card:hover { transform:translateY(-10px); border-color:rgba(124,58,237,0.5); box-shadow:0 25px 50px rgba(0,0,0,0.4); color:#fff; }
        .nav-card-icon { font-size:2.5rem; }
        .nav-card-title { font-size:1rem; font-weight:700; }
        .nav-card-sub { font-size:0.75rem; color:var(--text-muted); }
        .badge-rest { background:rgba(124,58,237,0.2); border:1px solid rgba(124,58,237,0.4); color:#a78bfa; border-radius:20px; padding:2px 10px; font-size:0.7rem; font-weight:700; letter-spacing:1px; margin-top:0.25rem; }
    </style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="hero">
    <div class="logo">⚽</div>
    <div class="hero-title">Futbol<span>Manager</span></div>
    <div class="hero-sub">API REST · Spring Boot + MongoDB Atlas</div>
    <div class="nav-cards">
        <a href="futbolistas.html" class="nav-card">
            <div class="nav-card-icon">🏃</div>
            <div class="nav-card-title">Futbolistas</div>
            <div class="nav-card-sub">Gestión de jugadores</div>
            <span class="badge-rest">REST</span>
        </a>
        <a href="clubes.html" class="nav-card">
            <div class="nav-card-icon">🏟️</div>
            <div class="nav-card-title">Clubes</div>
            <div class="nav-card-sub">Gestión de equipos</div>
            <span class="badge-rest">REST</span>
        </a>
        <a href="entrenadores.html" class="nav-card">
            <div class="nav-card-icon">👨‍💼</div>
            <div class="nav-card-title">Entrenadores</div>
            <div class="nav-card-sub">Cuerpo técnico</div>
            <span class="badge-rest">REST</span>
        </a>
    </div>
</div>
<script>
const canvas=document.getElementById('bg-canvas'),ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
const pts=Array.from({length:80},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,dx:(Math.random()-.5)*.5,dy:(Math.random()-.5)*.5,r:Math.random()*1.5+.3,a:Math.random()*.5+.1}));
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(167,139,250,${p.a})`;ctx.fill();p.x+=p.dx;p.y+=p.dy;if(p.x<0||p.x>canvas.width)p.dx*=-1;if(p.y<0||p.y>canvas.height)p.dy*=-1;});for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<130){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(124,58,237,${0.15*(1-d/130)})`;ctx.lineWidth=.5;ctx.stroke();}}requestAnimationFrame(draw);}
draw();
</script>
</body>
</html>
